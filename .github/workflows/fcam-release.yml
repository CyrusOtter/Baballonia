# Release build of Baballonia with the FCAM UDP Stream capture, started by pushing a tag fcam-v*.
# Same build steps as .github/workflows/build.yml (which upstream runs by hand); the release is
# created with the run's own GITHUB_TOKEN.
name: FCAM release

on:
  push:
    tags: [ "fcam-v*" ]

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - { result: Baballonia.x64.tar.xz, runs-on: ubuntu-22.04, arch: linux-x64 }
          - { result: Baballonia.arm64.tar.xz, runs-on: ubuntu-22.04-arm, arch: linux-arm64 }
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download dependencies
        run: ./download_dependencies.sh

      - name: Publish
        run: |
          cd src/Baballonia.Desktop
          dotnet publish -r ${{ matrix.arch }} -c Release --self-contained -f net10.0
          test -f bin/Release/net10.0/${{ matrix.arch }}/publish/Modules/Baballonia.FcamStreamCapture.dll
          cd "bin/Release/net10.0/${{ matrix.arch }}/publish"
          tar -cJf "$GITHUB_WORKSPACE/${{ matrix.result }}" *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.result }}
          path: ${{ matrix.result }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
        with:
          arch: x64

      - name: Download dependencies
        shell: pwsh
        run: ./download_dependencies.ps1

      - name: Publish
        run: |
          cd src/Baballonia.Desktop
          dotnet publish -r win-x64 -c Release --self-contained -f net10.0
          test -f bin/Release/net10.0/win-x64/publish/Modules/Baballonia.FcamStreamCapture.dll
          # Git Bash tar reads the colon of a Windows drive path as a remote host, so use the POSIX form of the workspace path.
          out="$(cygpath -u "$GITHUB_WORKSPACE")/Baballonia.win.tar.xz"
          cd "bin/Release/net10.0/win-x64/publish"
          tar --force-local -cJf "$out" *

      - name: Build the installer
        run: |
          cd src/Baballonia.Desktop
          makensis -DWORKFLOW_VERSION="${{ github.ref_name }}" main.nsi
          mv "Baballonia Setup.exe" "$(cygpath -u "$GITHUB_WORKSPACE")/Baballonia Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Baballonia Setup.exe
            Baballonia.win.tar.xz
          if-no-files-found: error

  release:
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the assets after the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          ls -la
          mv "Baballonia Setup.exe" "Baballonia.Setup.${TAG}.exe"
          mv Baballonia.win.tar.xz "Baballonia.win-x64.${TAG}.tar.xz"
          mv Baballonia.x64.tar.xz "Baballonia.linux-x64.${TAG}.tar.xz"
          mv Baballonia.arm64.tar.xz "Baballonia.linux-arm64.${TAG}.tar.xz"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Baballonia + FCAM ${{ github.ref_name }}
          files: artifacts/*
          body: |
            Baballonia with the **FCAM UDP Stream** capture: a face camera received over the network, for a Babble tracker plugged into another device, such as the USB-C port of a Steam Frame running [Babble-Bridge](https://github.com/CyrusOtter/Babble-Bridge).

            Built from upstream Baballonia `main` (5dbd332, 2026-08-31) plus one commit, branch [`feature/fcam-capture`](https://github.com/CyrusOtter/Baballonia/tree/feature/fcam-capture). Everything else is unchanged Baballonia.

            **Downloads**
            - Windows: `Baballonia.Setup.${{ github.ref_name }}.exe` (installer) or `Baballonia.win-x64.${{ github.ref_name }}.tar.xz` (portable, self-contained)
            - Linux: `Baballonia.linux-x64.${{ github.ref_name }}.tar.xz` or `Baballonia.linux-arm64.${{ github.ref_name }}.tar.xz`
            - `SHA256SUMS.txt` for the checksums

            **Using FCAM:** Home page, **Face Camera Address** `fcam://<sender-ip>:8555`, select **FCAM UDP Stream** in the drop-down below it, then **Start Camera**. No firewall rule is needed on the PC. Details: the "Network face cameras (FCAM)" section of the README on the branch.
